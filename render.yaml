# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Web services:
#   rag-document-analysis-backend — prod (API + ingest worker + Report Writer)
#   verbiage-demo — public Ask-only demo (see docs/demo-deploy.md)
#
# Optional separate worker (extra ~$7/mo): see docs/render-worker-setup.md
#
# Prod Standard (2GB): RERANK_ENABLED=1 + SKIP_RERANK=0 bakes MiniLM at image build
# (Render maps env vars to Docker ARG). Demo stays SKIP_RERANK=1 / RERANK_ENABLED=0.
# Dual tenant: DATABASE_URL=TrueDB, DEMO_DATABASE_URL=verbiage-demo. Do not set DEMO_MODE.
# INGEST_WORKER_ENABLED=1 processes photo vision on this service (no second worker).
# Health: /health/ready so Render waits out reranker warm-up (503 until MiniLM loads).
#
# Secrets use sync: false — managed in the Render dashboard.
services:
  - type: web
    name: rag-document-analysis-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: RERANK_ENABLED
        value: "1"
      - key: SKIP_RERANK
        value: "0"
      - key: INGEST_WORKER_ENABLED
        value: "1"
      - key: REPORT_EXPORT_MAX_PHOTOS
        value: "12"
      - key: HF_HOME
        value: /app/hf-cache
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DEMO_DATABASE_URL
        sync: false
      - key: PROD_SUPABASE_PROJECT_REF
        value: "dunxzvbxekxqrfnmtzmj"
      - key: DEMO_ANONYMOUS
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_DEFAULT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_DEFAULT_FOLDER_LABEL
        sync: false

  - type: web
    name: verbiage-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_ANONYMOUS
        value: "1"
      - key: DEMO_OPEN_SIGNUP
        value: "0"
      - key: DEMO_ASK_LIMIT
        value: "20"
      - key: DEMO_ASK_WINDOW_SECONDS
        value: "3600"
      - key: DEMO_SIGNUP_LIMIT
        value: "5"
      - key: RERANK_ENABLED
        value: "0"
      - key: SKIP_RERANK
        value: "1"
      - key: INGEST_WORKER_ENABLED
        value: "0"
      - key: LLM_TOKEN_LIMIT
        value: "5"
      - key: HF_HOME
        value: /app/hf-cache
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PROD_SUPABASE_PROJECT_REF
        sync: false
