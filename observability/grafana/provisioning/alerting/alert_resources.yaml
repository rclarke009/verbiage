# Contact points and notification routing for Verbiage alerts.
# Set VERBIAGE_ALERT_EMAIL (and optional GF_SMTP_* vars) before `docker compose up`.
# See observability/README.md § Alerting and docs/prod-observability.md for Grafana Cloud.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: verbiage-email
    receivers:
      - uid: verbiage_email_uid
        type: email
        settings:
          addresses: you@example.com
          singleEmail: false
          subject: '{{ template "verbiage_alert.subject" . }}'
          message: '{{ template "verbiage_alert.message" . }}'
        disableResolveMessage: false

templates:
  - orgId: 1
    name: verbiage_alert.subject
    template: |
      {{ define "verbiage_alert.subject" }}
      [Verbiage] {{ len .Alerts.Firing }} firing{{ if gt (len .Alerts.Resolved) 0 }}, {{ len .Alerts.Resolved }} resolved{{ end }}
      {{ end }}
  - orgId: 1
    name: verbiage_alert.message
    template: |
      {{ define "verbiage_alert.message" }}
      {{ range .Alerts }}
      **{{ .Labels.alertname }}** ({{ .Status }})
      {{ .Annotations.summary }}
      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
      ---
      {{ end }}
      {{ end }}

policies:
  - orgId: 1
    receiver: verbiage-email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: verbiage-email
        object_matchers:
          - - team
            - =
            - verbiage
